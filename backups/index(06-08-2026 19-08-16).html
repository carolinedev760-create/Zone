<!DOCTYPE html>
<html laang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Centralizado Zone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style/style.css"> 
</head>
<body>
    <div class="main-screen">   
        <div class="content-container">
            
            <div class="header">
                <img src="imagems/logozone.png" alt="Logo Zone" class="logo">
                
                <h2 class="subtitulo">Seu guia completo para viagens</h2>
            </div>
            
            <div class="main-options">
                
                 <a href="#" class="button guia">
                    <i class="fas fa-globe-americas"></i>
                    <div class="button-text">
                        <strong>Sou Turista</strong>
                        <span>Descubra destinos e guias</span>
                    </div>
                </a>
                </a>
                 <a href="#" class="button turista">
                    <i class="fas fa-suitcase-rolling"></i>
                    <div class="button-text">
                        <strong>Sou Guia Turístico</strong>
                        <span>Compartilhe suas experiências </span>
                    </div>
                </a>
                
                <div class="social-login-section">
                    <div class="social-login-separator">
                        <span class="separator-text">Ou entre com</span>
                    </div>
                    <div class="social-icons">
                        <a href="#" class="icon-link google">
                            <i class="fa-brands fa-google"></i>
                        </a>
                        <a href="#" class="icon-link facebook">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="#" class="icon-link apple">
                            <i class="fa-brands fa-apple"></i>
                        </a>
                    </div>
                </div>
                
            </div> </div> </div>

 </body>
