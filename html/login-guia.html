<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guia</title>
    <link rel="stylesheet" href="style/login-guia.css">
</head>
<body>

    <div class="container">

        <h1 class="logo">Zone</h1>

        <h2 class="titulo">Login como Guia</h2>
        <p class="subtitulo">Bem-vindo de volta ao seu guia turístico</p>

        <form id="formLogin">

            <div class="input-box">
                <img src="imagems/e-mail.png" class="icon">
                <input type="email" placeholder="Email profissional" required>
            </div>

            <div class="input-box">
                <img src="imagems/senha.png" class="icon">
                <input type="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                <a href="#" class="senha-link">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn">Entrar</button>

        </form>

        <p class="ou">Ou entre com</p>

        <div class="social-box">
            <img src="imagems/google.png">
            <img src="imagems/facebook.png">
            <img src="imagems/maça.png">
        </div>

        <p class="cadastro-text">
            Novo aqui? <a href="#" id="voltarCadastro">Cadastre-se</a>
        </p>

    </div>

    <script src="js/login-guia.js"></script>

</body>
</html>
